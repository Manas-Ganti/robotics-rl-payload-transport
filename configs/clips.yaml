# =============================================================================
# clips.yaml -- demo-video recording (eval/record_clips.py). Visuals only.
# =============================================================================
# Recorded AFTER training, from a checkpoint, as its own short job with the
# renderer on. Nothing here affects training or the evaluation numbers.
#
# PROOF RULE (portfolio): a clip is a chosen example, not a statistic. Every
# clip is logged to clips_manifest.json with its exact parameters and outcome;
# captions must come from there, and success rates only from the eval tables.
# =============================================================================

schema_version: 1
seed: 7
eval_config: "configs/eval_ood.yaml"   # nominal params + train config come from here

video:
  resolution: [1280, 720]      # multiples of 16 -> clean H.264 macroblocks
  frame_every_n_steps: 2       # policy runs at 50 Hz; every 2nd step -> 25 fps
  max_seconds: 20.0            # hard cap per clip (the episode timeout is 30 s)
  codec: "libx264"
  pixel_format: "yuv420p"      # required for playback in browsers / Safari
  quality: 8                   # imageio 0-10 (10 = best); 8 ~ 1-3 MB per clip

camera:
  # Chase camera: follows env 0's robot root (position only, not yaw).
  eye_offset_m: [-4.5, -4.5, 3.5]
  lookat_offset_m: [0.0, 0.0, 0.3]

markers:
  goal_radius_m: 0.30
  goal_color: [0.10, 0.85, 0.25]

record:
  num_envs: 4                  # small; only env 0 is filmed
  episodes_per_scenario: 2     # takes per (scenario, policy)
  policies: ["rl", "nav2"]     # "rl" needs --checkpoint; "random" also allowed

# Each scenario overrides the eval NOMINAL params (eval_ood.yaml: nominal) on
# the named axes only. Held-out values come from eval_ood.yaml's OOD ranges.
scenarios:
  - name: "nominal"
    note: "in-distribution baseline"
    params: {}
  - name: "dense_obstacles"
    note: "held-out obstacle density"
    params: {obstacle_density: 0.8}
  - name: "heavy_on_slope"
    note: "held-out payload on a held-out slope (forced params apply the slope even when phases.enable_slope is off -- a Phase 1 policy has never seen one)"
    params: {payload_mass_kg: 70.0, slope_angle_deg: 15.0}
  - name: "low_friction"
    note: "held-out friction"
    params: {friction_coeff: 0.15}
  # --- diagnostics (not portfolio clips): watch unexplained eval failures ---
  - name: "slope_5deg"
    note: "DIAGNOSTIC: in-distribution 5 deg slope, where every policy (even random) failed in eval"
    params: {slope_angle_deg: 5.0}
  - name: "slope_10deg"
    note: "DIAGNOSTIC: 10 deg, which succeeded -- the control for slope_5deg"
    params: {slope_angle_deg: 10.0}
