# =============================================================================
# robot.yaml -- ROBOT + SENSOR configuration
# =============================================================================
# The robot choice is ISOLATED here (CLAUDE.md: "Use an Isaac Lab built-in
# mobile robot; do not model a custom robot"). To swap robots, change this file
# only -- env/nav_env.py reads the asset path and joint names from here.
# =============================================================================

schema_version: 1

robot:
  # NVIDIA Carter (v1): a real differential-drive AMR, sized for the 1-9 kg
  # payload axis. The JetBot was dropped after ARC smoke tests showed a 2 kg
  # chassis on 3 cm wheels reaching 0.38 of 1.5 m/s and ~1% of the commanded
  # turn rate under a 1-5 kg load -- the payload axis would have measured motor
  # saturation, not transport. (JetBot values, for reference: nucleus_asset
  # Robots/Jetbot/jetbot.usd, wheels left_wheel_joint/right_wheel_joint,
  # radius 0.0325, separation 0.118, chassis body "chassis", 2.0 kg.)
  #
  # Values marked PENDING come from `arc/inspect_usd.py` on the login node and
  # must be confirmed before the first Carter smoke test.
  name: "carter_v1"
  cfg_import_path: "env.robots.make_diff_drive_cfg"
  nucleus_asset: "Robots/Carter/carter_v1.usd"   # PENDING: confirm HTTP 200 (4.5 layout)
  # null -> NVIDIA's Nucleus/S3 asset. A local copy (downloaded on the login
  # node) avoids depending on the content server during jobs.
  usd_path: null

  # Drivetrain -------------------------------------------------------------
  drive_type: "differential"
  wheel_radius_m: 0.24         # PENDING
  wheel_base_m: 0.54           # PENDING: left-right wheel separation
  left_wheel_joint: "left_wheel"     # PENDING: exact USD joint names
  right_wheel_joint: "right_wheel"   # PENDING
  # Caps wheel speed; action.lin_vel_range tops out at 1.5 m/s = 1.5/r rad/s.
  max_wheel_speed_rad_s: 7.0   # PENDING (depends on wheel_radius_m)
  # Only the two wheels are actuated (casters stay passive). Velocity control:
  # stiffness 0, damping = velocity gain; null keeps the USD's value.
  actuator:
    stiffness: 0.0
    damping: null              # PENDING: USD drive damping from inspect_usd.py
    effort_limit: null         # null -> USD maxForce

  # Spawn ------------------------------------------------------------------
  # Must be >= "root above lowest" from inspect_usd.py, or the wheels spawn
  # inside the ground and PhysX ejects the robot. Too high only costs a short drop.
  spawn_height_m: 0.30         # PENDING
  # USD chassis mass; the pure payload analysis (tip-over, mass ratio) uses it.
  # The simulator uses the USD value directly and adds the payload on top.
  base_mass_kg: 25.0           # PENDING: chassis mass from inspect_usd.py / smoke test
  # Body used for contact sensing + payload mass.
  base_body_name: "chassis_link"   # PENDING

# ---------------------------------------------------------------------------
# PAYLOAD -- the dynamics axis of this study (replaces gravity randomization).
# Mass is sampled per episode from domain ranges in train.yaml / eval_ood.yaml.
# ---------------------------------------------------------------------------
payload:
  enabled: true
  attach_mode: "mass_modifier"   # "mass_modifier" | "rigid_body_with_joint"
  # mass_modifier         : adds the payload to the chassis body's USD mass.
  #                         Fast; no separate body, so no load-shift dynamics.
  # rigid_body_with_joint : NOT WIRED (the FixedJoint weld is never created;
  #                         selecting it raises). Needed before interpreting the
  #                         v2 jerk/energy terms as "protecting the payload".
  shape: "box"
  size_m: [0.12, 0.12, 0.10]
  offset_m: [0.0, 0.0, 0.30]   # relative to base_body_name origin (deck height; PENDING)
  # VERIFY ON A100: rigid-body payload requires a FixedJoint between payload and
  #                 chassis; see env/payload.py::attach_payload.

# ---------------------------------------------------------------------------
# SENSORS
# ---------------------------------------------------------------------------
sensors:
  # Primary exteroceptive sensor. depth-only is fine for v1 (CLAUDE.md).
  #   "analytic_lidar" (DEFAULT): exact ray-circle casting against the episode's
  #       TerrainSpec in torch (env/lidar.py). Sees the per-episode kinematic
  #       obstacles, which Isaac Lab's RayCaster (static meshes only) likely
  #       cannot. No sensor prim, no rendering, locally unit-tested.
  #   "raycaster": Isaac Lab RayCaster. Kept for comparison; likely blind to
  #       obstacles (setup_notes.md Tier 1).
  #   "camera": not wired. Viable on L40S (RT cores) via TiledCameraCfg.
  modality: "analytic_lidar"   # "analytic_lidar" | "raycaster" | "camera"

  analytic_lidar:
    # The patch edge is a drop-off; Nav2's costmap is bounded to the same patch,
    # so exposing it as a wall keeps the head-to-head even.
    boundary_as_obstacle: true

  raycaster:
    # Ray GEOMETRY below is shared by "raycaster" and "analytic_lidar", so the
    # observation layout is identical whichever modality is chosen.
    # VERIFY ON A100 (raycaster modality only): isaaclab.sensors.RayCasterCfg + patterns.LidarPatternCfg
    num_rays: 64
    horizontal_fov_deg: 180.0  # forward-facing half-plane
    max_range_m: 8.0
    min_range_m: 0.05
    height_offset_m: 0.10      # ray origin above chassis
    update_period_s: 0.02      # match policy dt (sim.dt * decimation)

  camera:
    # Only used when modality == "camera".
    # VERIFY ON A100: isaaclab.sensors.TiledCameraCfg is the performant option;
    #                 plain CameraCfg will not scale to thousands of envs.
    width: 64
    height: 48
    horizontal_fov_deg: 90.0
    max_range_m: 8.0
    data_type: "distance_to_image_plane"
    update_period_s: 0.02

  contact:
    # Collision detection ground truth for termination + the collision metric.
    # VERIFY ON A100: isaaclab.sensors.ContactSensorCfg; prim path must cover
    #                 the chassis (and payload, if rigid-body attached).
    enabled: true
    history_length: 3
    track_air_time: false

  # Sensor degradation (Phase 4). Magnitudes come from the domain ranges;
  # these flags control HOW the degradation is applied.
  degradation:
    dropout_fill_value: "max_range"   # "max_range" | "zero" | "last_valid"
    noise_type: "gaussian"            # additive, std from domain ranges
    apply_before_normalization: true
